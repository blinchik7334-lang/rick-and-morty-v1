name: Build
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - name: Build mod
        run: gradle build
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: RickMorty-Mod
          path: build/libs/*.jar
          if-no-files-found: error
