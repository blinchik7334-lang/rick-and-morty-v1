name: Build
on:
push:
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v3
    with:
      gradle-version: '8.8'

  - name: Build mod
    run: gradle build

  - name: Upload mod
    uses: actions/upload-artifact@v4
    with:
      name: RickMorty-Mod
      path: build/libs/*.jar
      if-no-files-found: error
